<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엄마 인사말 추천</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
    }

    body{
      min-height:100vh;
      background: linear-gradient(135deg,#ffe3ec,#fff6d6,#dff7ff);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:500px;
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(14px);
      border-radius:28px;
      padding:32px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h1{
      font-size:2rem;
      text-align:center;
      margin-bottom:10px;
      color:#333;
    }

    .sub{
      text-align:center;
      color:#666;
      margin-bottom:30px;
      line-height:1.5;
      font-size:0.95rem;
    }

    .section{
      margin-bottom:24px;
    }

    .label{
      display:block;
      margin-bottom:10px;
      font-weight:600;
      color:#444;
      font-size:1rem;
    }

    select{
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,0.05);
      font-size:1rem;
      outline:none;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#ff9ecf,#ffb36b);
      color:white;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      transition:0.25s;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .result{
      margin-top:28px;
      padding:24px;
      border-radius:22px;
      background:white;
      line-height:1.8;
      font-size:1.05rem;
      color:#333;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
      min-height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .emoji{
      font-size:1.4rem;
      margin-right:6px;
    }

    @media(max-width:600px){

      .container{
        padding:24px;
      }

      h1{
        font-size:1.7rem;
      }

      .result{
        font-size:1rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💌 엄마 인사말 추천</h1>

    <p class="sub">
      오늘의 날씨와 엄마의 기분을 선택하면<br>
      어울리는 따뜻한 인사말을 추천해드려요.
    </p>

    <div class="section">
      <label class="label">🌤 오늘의 날씨</label>

      <select id="weather">
        <option value="sunny">맑음</option>
        <option value="rainy">비 오는 날</option>
        <option value="cloudy">흐림</option>
        <option value="snowy">눈 오는 날</option>
      </select>
    </div>

    <div class="section">
      <label class="label">😊 엄마의 기분 상태</label>

      <select id="mood">
        <option value="happy">기분 좋음</option>
        <option value="tired">피곤함</option>
        <option value="sad">우울함</option>
        <option value="busy">바쁨</option>
      </select>
    </div>

    <button onclick="recommendMessage()">
      인사말 추천받기
    </button>

    <div class="result" id="result">
      오늘 엄마께 어떤 말을 전할까요? 💖
    </div>

  </div>

  <script>

    const messages = {

      sunny: {
        happy: [
          "☀️ 날씨처럼 엄마 웃는 하루였으면 좋겠어! 오늘도 사랑해 💛",
          "🌼 맑은 날씨만큼 엄마 하루도 행복으로 가득하길 바라!"
        ],

        tired: [
          "☀️ 오늘 햇살 좋은 날이니까 엄마도 잠깐 쉬어가면서 힘냈으면 좋겠어 💛",
          "🌤 햇빛 보면서 기분 전환도 하고 오늘은 조금 덜 힘들었으면 좋겠어!"
        ],

        sad: [
          "🌼 맑은 하늘처럼 엄마 마음도 다시 환해졌으면 좋겠어 💖",
          "☀️ 오늘은 좋은 일 하나쯤 꼭 생길 거야 엄마!"
        ],

        busy: [
          "💛 바쁜 하루겠지만 엄마 밥 꼭 챙겨 먹고 너무 무리하지 마!",
          "🌤 오늘도 열심히인 엄마 멋있어! 조금만 힘내 💪"
        ]
      },

      rainy: {
        happy: [
          "☔ 비 오는 날인데도 엄마 기분 좋다니 다행이야 💖",
          "🌧 오늘은 따뜻한 거 마시면서 행복한 하루 보내!"
        ],

        tired: [
          "☔ 비 오는 날엔 더 피곤하니까 오늘은 푹 쉬었으면 좋겠어 💙",
          "🌧 엄마 감기 걸리지 말고 따뜻하게 있어!"
        ],

        sad: [
          "💙 비 오는 날이라 괜히 더 울적할 수 있는데 엄마 혼자 힘들어하지 마",
          "☔ 오늘 하루는 천천히 보내도 괜찮아 엄마!"
        ],

        busy: [
          "🌧 비 오는 날인데 이동 조심하고 오늘도 화이팅이야 💪",
          "☔ 우산 꼭 챙기고 너무 무리하지 마!"
        ]
      },

      cloudy: {
        happy: [
          "☁️ 흐린 날씨지만 엄마 덕분에 우리 집은 밝아 💖",
          "🌥 오늘도 엄마 웃는 하루였으면 좋겠어!"
        ],

        tired: [
          "☁️ 흐린 날엔 더 지칠 수 있으니까 푹 쉬어 엄마 🤍",
          "🌥 오늘은 엄마가 조금 덜 힘든 하루였으면 좋겠어"
        ],

        sad: [
          "🤍 흐린 하늘은 잠깐이니까 엄마 기분도 곧 좋아질 거야!",
          "☁️ 오늘 하루도 잘 버텨줘서 고마워 엄마"
        ],

        busy: [
          "🌥 바쁜 하루겠지만 잠깐씩 쉬면서 해 엄마!",
          "☁️ 오늘도 열심히인 엄마 응원해 💪"
        ]
      },

      snowy: {
        happy: [
          "❄️ 눈 오는 날이라 더 설레는 하루네! 엄마 행복한 하루 보내 💖",
          "☃️ 따뜻한 하루 보내고 감기 조심해 엄마!"
        ],

        tired: [
          "❄️ 추운 날씨니까 오늘은 따뜻하게 쉬어 엄마 🤍",
          "☃️ 눈 오는 날엔 따뜻한 차 한잔 꼭 마셔!"
        ],

        sad: [
          "🤍 눈처럼 포근한 하루가 엄마에게 왔으면 좋겠어",
          "❄️ 오늘은 마음까지 따뜻해지는 일 생기길 바라!"
        ],

        busy: [
          "☃️ 길 미끄러우니까 조심하고 너무 무리하지 마!",
          "❄️ 바쁜 하루겠지만 따뜻하게 입고 다녀 엄마 💖"
        ]
      }

    };

    function recommendMessage(){

      const weather = document.getElementById("weather").value;
      const mood = document.getElementById("mood").value;

      const selectedMessages = messages[weather][mood];

      const randomMessage =
        selectedMessages[Math.floor(Math.random() * selectedMessages.length)];

      document.getElementById("result").innerHTML = randomMessage;
    }

  </script>

</body>
</html>
