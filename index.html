<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 입지?</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
    }

    body{
      min-height:100vh;
      background:
      linear-gradient(rgba(10,10,20,0.55), rgba(10,10,20,0.55)),
      url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1400&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:25px;
      color:white;
    }

    .app{
      width:100%;
      max-width:1200px;
      height:700px;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:35px;
      overflow:hidden;
      display:flex;
      box-shadow:0 20px 40px rgba(0,0,0,0.3);
    }

    /* 왼쪽 */
    .left{
      width:42%;
      padding:45px;
      background:rgba(255,255,255,0.08);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-size:2.5rem;
      font-weight:800;
      line-height:1.2;
    }

    .sub{
      margin-top:15px;
      color:rgba(255,255,255,0.8);
      line-height:1.6;
      font-size:1rem;
    }

    .weather-card{
      margin-top:30px;
      background:rgba(255,255,255,0.12);
      border-radius:30px;
      padding:30px;
    }

    .city{
      font-size:1rem;
      opacity:0.8;
    }

    .temp{
      font-size:6rem;
      font-weight:800;
      margin:15px 0;
    }

    .weather{
      font-size:1.2rem;
      opacity:0.9;
    }

    /* 오른쪽 */
    .right{
      width:58%;
      padding:45px;
      overflow-y:auto;
    }

    .section-title{
      font-size:1.5rem;
      font-weight:700;
      margin-bottom:20px;
    }

    .level-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:15px;
      margin-bottom:35px;
    }

    .level-btn{
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:20px;
      padding:20px 10px;
      text-align:center;
      cursor:pointer;
      transition:0.25s;
    }

    .level-btn:hover{
      transform:translateY(-5px);
      background:white;
      color:#222;
    }

    .level-btn.active{
      background:white;
      color:#222;
    }

    .level-number{
      font-size:2rem;
      font-weight:800;
    }

    .level-desc{
      margin-top:8px;
      font-size:0.9rem;
    }

    .recommend-card{
      background:white;
      color:#222;
      border-radius:30px;
      padding:35px;
      min-height:300px;
    }

    .recommend-title{
      font-size:1.4rem;
      font-weight:800;
      margin-bottom:20px;
      color:#4f46e5;
    }

    .recommend-content{
      font-size:1.1rem;
      line-height:2;
    }

    button.main-btn{
      margin-top:30px;
      width:100%;
      border:none;
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      color:white;
      padding:18px;
      border-radius:18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      transition:0.25s;
    }

    button.main-btn:hover{
      transform:scale(1.02);
    }

    .loading{
      margin-top:15px;
      opacity:0.8;
    }

    @media(max-width:950px){

      .app{
        flex-direction:column;
        height:auto;
      }

      .left{
        width:100%;
      }

      .right{
        width:100%;
      }

      .level-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .temp{
        font-size:4.5rem;
      }
    }

    @media(max-width:500px){

      .left,
      .right{
        padding:25px;
      }

      .logo{
        font-size:2rem;
      }

      .level-grid{
        grid-template-columns:1fr;
      }

      .temp{
        font-size:4rem;
      }
    }

  </style>
</head>
<body>

  <div class="app">

    <!-- 왼쪽 -->
    <div class="left">

      <div>

        <div class="logo">
          오늘 뭐 입지? ✨
        </div>

        <div class="sub">
          오늘 날씨와 꾸밈 정도를 분석해서<br>
          가장 어울리는 코디를 추천해드려요.
        </div>

        <div class="weather-card">

          <div class="city" id="city">
            📍 현재 위치
          </div>

          <div class="temp" id="temp">
            --°
          </div>

          <div class="weather" id="weather">
            날씨 정보를 불러오는 중...
          </div>

        </div>

      </div>

      <button class="main-btn" onclick="getWeather()">
        오늘의 코디 추천받기
      </button>

      <div class="loading" id="loading"></div>

    </div>

    <!-- 오른쪽 -->
    <div class="right">

      <div class="section-title">
        꾸밈 단계 선택 🎨
      </div>

      <div class="level-grid">

        <div class="level-btn active" onclick="selectLevel(1,this)">
          <div class="level-number">1</div>
          <div class="level-desc">추리닝</div>
        </div>

        <div class="level-btn" onclick="selectLevel(2,this)">
          <div class="level-number">2</div>
          <div class="level-desc">편한 외출</div>
        </div>

        <div class="level-btn" onclick="selectLevel(3,this)">
          <div class="level-number">3</div>
          <div class="level-desc">평범 꾸안꾸</div>
        </div>

        <div class="level-btn" onclick="selectLevel(4,this)">
          <div class="level-number">4</div>
          <div class="level-desc">꾸민 느낌</div>
        </div>

        <div class="level-btn" onclick="selectLevel(5,this)">
          <div class="level-number">5</div>
          <div class="level-desc">완전 풀착장</div>
        </div>

      </div>

      <div class="recommend-card">

        <div class="recommend-title">
          👗 오늘의 추천 코디
        </div>

        <div class="recommend-content" id="recommend">
          버튼을 눌러 추천을 받아보세요!
        </div>

      </div>

    </div>

  </div>

  <script>

    let selectedLevel = 1;

    function selectLevel(level, element){

      selectedLevel = level;

      document.querySelectorAll(".level-btn")
      .forEach(btn => btn.classList.remove("active"));

      element.classList.add("active");
    }

    async function getWeather(){

      const loading = document.getElementById("loading");
      loading.innerText = "날씨 분석중...";

      navigator.geolocation.getCurrentPosition(async(position)=>{

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        try{

          const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`
          );

          const data = await response.json();

          const temp = Math.round(data.current.temperature_2m);

          document.getElementById("temp").innerText = `${temp}°`;

          let weatherText = "";

          if(temp >= 28) weatherText = "엄청 더운 날씨 ☀️";
          else if(temp >= 20) weatherText = "따뜻한 날씨 🌤";
          else if(temp >= 10) weatherText = "선선한 날씨 🍂";
          else weatherText = "추운 날씨 ❄️";

          document.getElementById("weather").innerText = weatherText;

          let result = "";

          // LEVEL 1
          if(selectedLevel === 1){

            if(temp >= 23){
              result = `
              🖤 오버핏 반팔 + 반바지<br>
              🖤 슬리퍼 or 크록스<br>
              🖤 완전 편한 마실룩
              `;
            }

            else{
              result = `
              🖤 후드집업 + 조거팬츠<br>
              🖤 운동화<br>
              🖤 편안한 추리닝 코디
              `;
            }
          }

          // LEVEL 2
          else if(selectedLevel === 2){

            result = `
            🤍 맨투맨 + 와이드 팬츠<br>
            🤍 기본 운동화<br>
            🤍 편하지만 깔끔한 외출룩
            `;
          }

          // LEVEL 3
          else if(selectedLevel === 3){

            result = `
            💙 셔츠 + 데님 팬츠<br>
            💙 가디건 포인트<br>
            💙 꾸안꾸 감성 코디
            `;
          }

          // LEVEL 4
          else if(selectedLevel === 4){

            result = `
            ❤️ 자켓 + 슬랙스<br>
            ❤️ 액세서리 포인트<br>
            ❤️ 세련된 스타일 추천
            `;
          }

          // LEVEL 5
          else{

            result = `
            ✨ 코트 or 블레이저<br>
            ✨ 레이어드 스타일링<br>
            ✨ 부츠 + 악세사리 매치<br>
            ✨ 완전 꾸민 인스타 감성룩
            `;
          }

          document.getElementById("recommend").innerHTML = result;

          loading.innerText = "";

        }catch(error){

          loading.innerText = "";
          alert("날씨를 불러오지 못했습니다.");

        }

      });

    }

  </script>

</body>
</html>
